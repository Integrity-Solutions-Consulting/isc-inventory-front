<div class="profile-container">
  <h2>Perfil de Usuario</h2>
  
  <div class="profile-info" *ngIf="userData">
    <div class="profile-field">
      <span class="field-label">Nombre:</span>
      <span class="field-value">{{ userData.name }}</span>
    </div>
    <div class="profile-field">
      <span class="field-label">Email:</span>
      <span class="field-value">{{ userData.email }}</span>
    </div>
    <!-- Agrega más campos según los datos que tengas -->
  </div>

  <button mat-raised-button color="primary" class="edit-button">
    Editar Perfil
  </button>
</div>
