name: Deploy Angular Frontend

on:
  push:
    branches:
      - develop  # o la rama que uses

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Copy project to VPS
        run: |
          ssh -o StrictHostKeyChecking=no root@147.93.181.146 "rm -rf /opt/angular_app && mkdir -p /opt/angular_app"
          scp -r . root@147.93.181.146:/opt/angular_app
      - name: Build and run Docker on VPS
        run: |
          ssh root@147.93.181.146 << 'EOF'
            cd /opt/angular_app
            docker compose down
            docker compose build --no-cache
            docker compose up -d
          EOF
