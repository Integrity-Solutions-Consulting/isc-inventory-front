<div class="chart-title">
  <h2>Equipos/Recursos</h2>
</div>
<div class="scrollable-chart">
  @if (barChartData()) {
  <ngx-charts-bar-vertical
    [results]="barChartData()"
    [view]="[barWidth, 300]"
    [legend]="false"
    [showGridLines]="false"
    [scheme]="'cool'"
    [xAxis]="true"
    [yAxis]="true"
    [showXAxisLabel]="true"
    [showYAxisLabel]="true"
    [tooltipDisabled]="true"
  >
  </ngx-charts-bar-vertical>
  }
</div>
