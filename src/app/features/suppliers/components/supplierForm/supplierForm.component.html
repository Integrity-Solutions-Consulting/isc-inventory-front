<div class="form-wrapper">
  <div class="form-overlay" *ngIf="isSubmitting || loading">
    <div class="loading-spinner">
      <mat-progress-spinner mode="indeterminate" diameter="30"></mat-progress-spinner>
      <span style="margin-left: 10px" *ngIf="isSubmitting">Guardando...</span>
      <span style="margin-left: 10px" *ngIf="loading">Cargando...</span>
    </div>
  </div>

  <div [formGroup]="supplierForm">
    <div class="form-row">
      <!-- Nombre Empresa -->
      <div class="form-field">
        <label>Nombre Empresa</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput formControlName="businessName" />
          <mat-error *ngIf="supplierForm.get('businessName')?.hasError('required')">
            El nombre de la empresa es obligatoria
          </mat-error>
        </mat-form-field>
      </div>

      <!-- RUC -->
      <div class="form-field">
        <label>RUC</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput formControlName="taxId" />
          <mat-error *ngIf="supplierForm.get('taxId')?.hasError('required')">
            El RUC es obligatorio
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="form-row">
      <!-- Dirección -->
      <div class="form-field">
        <label>Dirección</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput formControlName="address" />
          <mat-error *ngIf="supplierForm.get('address')?.hasError('required')">
            La dirección es obligatoria
          </mat-error>
        </mat-form-field>
      </div>

      <!-- Teléfono -->
      <div class="form-field">
        <label>Teléfono</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput formControlName="phone" />
          <mat-error *ngIf="supplierForm.get('phone')?.hasError('required')">
            El teléfono es obligatorio
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="form-row">
      <!-- Email -->
      <div class="form-field">
        <label>Email</label>
        <mat-form-field appearance="outline" class="w-100">
          <input matInput type="email" formControlName="email" />
          <mat-error *ngIf="supplierForm.get('email')?.hasError('required')">
            El email es obligatorio
          </mat-error>
          <mat-error *ngIf="supplierForm.get('email')?.hasError('email')">
            Ingresa un email válido
          </mat-error>
        </mat-form-field>
      </div>
    </div>

    <div class="itg-button-group">
      <button mat-flat-button class="itg-cancel-button" (click)="onCancel()">
        Cancelar
      </button>
      <button
        mat-flat-button
        class="itg-primary-button"
        (click)="onSubmit()"
        [disabled]="isSubmitting"
      >
        {{ supplierId != 0 ? 'Actualizar' : 'Crear' }}
      </button>
    </div>
  </div>
</div>
